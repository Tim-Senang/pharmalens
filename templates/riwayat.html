<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riwayat Scan | Pharmalens</title>
  <link rel="stylesheet" href="./src/input.css">
  <link rel="stylesheet" href="./src/output.css">
  <link rel="stylesheet" href="./css/riwayat-modern.css">
  <link rel="shortcut icon" href="./img/pharmalens.png" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
</head>
<body class="bg-green-900 min-h-screen">
  <div class="navbar px-4 py-1 sticky top-0 text-green-900 bg-white z-50">
    <div class="container mx-auto">
      <div class="navbar-box flex items-center justify-between">
        <div class="logo flex items-center gap-x-2">
          <img src="./img/pharmalens.png" alt="logo" class="md:w-9 w-7">
          <h1 class="font-extrabold md:text-xl text-md">Pharmalens</h1>
        </div>
        <ul class="menu flex gap-x-4 py-1 items-center font-bold md:static absolute z-10 top-17 left-0 md:flex-row flex-col md:bg-transparent bg-green-100 md:text-green-800 text-green-700 md:w-auto w-full">
          <li class="py-4 w-full text-center"><a href="index.html#beranda" class="p-4 hover:bg-green-900 hover:text-green-100 rounded-2xl duration-500">Beranda</a></li>
          <li class="py-4 w-full text-center"><a href="index.html#tentang" class="p-4 hover:bg-green-900 hover:text-green-100 rounded-2xl duration-500">Tentang</a></li>
          <li class="py-4 w-full text-center"><a href="index.html#fitur" class="p-4 hover:bg-green-900 hover:text-green-100 rounded-2xl duration-500">Fitur</a></li>
          <li class="py-4 w-full text-center"><a href="scan.html" id="scanNavLink" style="display:none" class="p-4 hover:bg-green-900 hover:text-green-100 rounded-2xl duration-500">Scan</a></li>
          <li class="py-4 w-full text-center"><a href="riwayat.html" id="riwayatNavLink" style="display:none" class="p-4 hover:bg-green-900 hover:text-green-100 rounded-2xl duration-500">Riwayat</a></li>
        </ul>
        <div class="md:hidden block">
          <button class="hamburger hamburger--elastic" type="button">
            <span class="hamburger-box">
              <span class="hamburger-inner"></span>
            </span>
          </button>
        </div>
        <div id="authBtnContainer" class="flex items-center ml-4"></div>
      </div>
    </div>
  </div>

  <div class="my-12 md:px-20 sm:px-6 px-2 min-h-[80vh]" id="riwayat">
    <div class="mx-auto px-2">
      <!-- Header diganti dengan statistik dan judul oleh JS -->
      <div class="scan-form bg-white/80 flex flex-col items-center justify-center gap-6 p-7 rounded-2xl min-h-[400px] shadow-lg">
        <div class="flex flex-col items-center justify-center gap-3 animate-pulse">
          <img src="./img/history-scan.svg" alt="Scan History" class="w-24 md:w-32 opacity-70">
          <div class="h-5 w-40 bg-gradient-to-r from-green-200 via-cyan-100 to-yellow-100 rounded-full"></div>
          <div class="h-4 w-24 bg-gradient-to-r from-cyan-100 to-green-100 rounded-full"></div>
        </div>
        <p class="text-gray-400 text-center mt-2">Memuat riwayat scan...</p>
      </div>
    </div>
  </div>
  <script src="./js/riwayat.js"></script>
  <script src="./js/script.js"></script>
</body>
</html>
